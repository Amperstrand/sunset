[package]
name = "sunset-async"
version = "0.6.0"
edition = "2024"
repository = "https://github.com/mkj/sunset"
categories = ["network-programming", "embedded", "no-std"]
license = "0BSD"
description = "Async for Sunset SSH"

[dependencies]
embassy-sync.workspace = true
embassy-futures.workspace = true
embedded-io-async.workspace = true
portable-atomic.workspace = true

# default-features = false + the forwarded `mlkem` feature below: embedded
# consumers can opt the (default-ON) mlkem post-quantum kex out of the
# binary; std users keep the exact previous feature set by default.
sunset = { workspace = true, default-features = false, features = ["embedded-io"] }

log.workspace = true

futures-io = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
embedded-io-adapters = { workspace = true, optional = true }

[features]
default = ["mlkem"]
mlkem = ["sunset/mlkem"]
# Use a critical-section mutex to lock state. This feature must be enabled
# to run on executors that require futures to be Send (such as default Tokio).
# The application should depend on critical-section "std" feature.
# When multi-thread is disabled locking overhead is avoided.
multi-thread = []
alloc = ["sunset/alloc"]
std = ["sunset/std", "alloc"]

# For async-net TcpStream etc
futures-io = ["dep:futures-io", "embedded-io-adapters/futures-03"]
# For tokio TcpStream etc
tokio = ["dep:tokio", "embedded-io-adapters/tokio-1"]
